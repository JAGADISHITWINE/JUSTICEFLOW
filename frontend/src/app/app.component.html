<!-- Login / Full Screen Mode -->
<ng-container *ngIf="isAuthPage">
  <router-outlet></router-outlet>
</ng-container>

<!-- Authenticated Law Firm Workspace Layout -->
<div *ngIf="!isAuthPage" class="app-container">
  <!-- Mobile Backdrop -->
  <div
    *ngIf="sidebarMobileOpen"
    class="app-sidebar-backdrop"
    (click)="closeMobileSidebar()">
  </div>

  <!-- Left Sidebar -->
  <app-sidebar
    [collapsed]="sidebarCollapsed"
    [mobileOpen]="sidebarMobileOpen"
    (collapseChange)="onSidebarCollapse($event)"
    (navigate)="closeMobileSidebar()">
  </app-sidebar>

  <!-- Main View Area -->
  <div class="main-layout">
    <app-navbar
      [currentUser]="currentUser"
      (sidebarToggle)="toggleSidebar()">
    </app-navbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Global Floating Toasts -->
<div class="toast-container-custom">
  <div
    *ngFor="let toast of toasts"
    class="toast show shadow-lg border-0"
    role="alert"
    aria-live="assertive"
    aria-atomic="true">
    <div class="toast-header bg-white border-bottom">
      <i class="bi me-2 fs-6" [ngClass]="getToastIcon(toast.type)"></i>
      <strong class="me-auto text-dark">{{ toast.title || 'Notice' }}</strong>
      <button type="button" class="btn-close" (click)="removeToast(toast.id)"></button>
    </div>
    <div class="toast-body bg-white text-dark small">
      {{ toast.message }}
    </div>
  </div>
</div>
